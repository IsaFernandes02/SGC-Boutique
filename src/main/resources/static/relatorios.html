<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Relatórios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="sidebar">

        <h2><i class="fa-solid fa-store"></i> SGC Boutique</h2>

        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="produtos.html"><i class="fa-solid fa-shirt"></i> Produtos</a>
        <a href="vendas.html"><i class="fa-solid fa-cart-shopping"></i> Vendas</a>
        <a href="relatorios.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>

        <a href="#" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </a>

    </div>

    <div class="main">

        <div class="card p-4">

            <h2 class="mb-4">Relatório de Vendas</h2>

            <div class="row mb-3">

                <div class="col-md-4">
                    <label>Data Inicial</label>
                    <input type="date" id="dataInicio" class="form-control">
                </div>

                <div class="col-md-4">
                    <label>Data Final</label>
                    <input type="date" id="dataFim" class="form-control">
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="gerarRelatorio()">
                        Gerar Relatório
                    </button>
                </div>

            </div>

            <table class="table table-striped">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="relatorioTable"></tbody>

            </table>

            <h4 class="mt-3">
                Total Geral: <span id="totalRelatorio">R$ 0,00</span>
            </h4>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth.js"></script>

    <script>
        verificarLogin();
    </script>

    <script src="js/relatorios.js"></script>

</body>

</html>
