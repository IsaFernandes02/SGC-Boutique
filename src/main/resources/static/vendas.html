<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Vendas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="sidebar">

        <h2><i class="fa-solid fa-store"></i> SGC Boutique</h2>

        <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="clientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="produtos.html"><i class="fa-solid fa-shirt"></i> Produtos</a>
        <a href="vendas.html"><i class="fa-solid fa-cart-shopping"></i> Vendas</a>
        <a href="relatorios.html"><i class="fa-solid fa-file-lines"></i> Relatório</a>

        <a href="#" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </a>

    </div>

    <div class="main">

        <div class="card p-4">

            <h2 class="mb-4">Vendas</h2>

            <button class="btn btn-success mb-3" onclick="abrirVenda()">
                Nova Venda
            </button>

            <table class="table table-striped">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="vendasTable"></tbody>

            </table>

        </div>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalVenda">
        <div class="modal-dialog modal-lg">
            <div class="modal-content p-4">

                <h4>Nova Venda</h4>

                <label>Cliente</label>

                <div class="d-flex gap-2 mb-3">

                    <select id="clienteSelect" class="form-control"></select>

                    <button class="btn btn-primary" onclick="abrirModalCliente()">
                        + Cliente
                    </button>

                </div>

                <hr>

                <label>Produto</label>
                <select id="produtoSelect" class="form-control mb-2"></select>

                <input type="number" id="quantidade" placeholder="Quantidade" class="form-control mb-2">

                <button class="btn btn-primary mb-3" onclick="addItem()">Adicionar</button>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody id="itensTabela"></tbody>
                </table>

                <h4>Total: R$ <span id="total">0</span></h4>

                <button class="btn btn-success mt-3" onclick="salvarVenda()">
                    Finalizar Venda
                </button>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalClienteVenda">
        <div class="modal-dialog">
            <div class="modal-content p-4">

                <h4>Novo Cliente</h4>

                <input id="novoNome" class="form-control mb-2" placeholder="Nome">
                <input id="novoCpf" class="form-control mb-2" placeholder="CPF">
                <input id="novoEmail" class="form-control mb-2" placeholder="Email">
                <input id="novoTelefone" class="form-control mb-2" placeholder="Telefone">
                <input id="novoEndereco" class="form-control mb-2" placeholder="Endereço">

                <button class="btn btn-success mt-3" onclick="salvarClienteVenda()">
                    Salvar Cliente
                </button>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/vendas.js"></script>

</body>

</html>
