<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="sidebar">

        <h2>
            <i class="fa-solid fa-store"></i>
            SGC Boutique
        </h2>

        <a href="index.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="clientes.html">
            <i class="fa-solid fa-users"></i>
            Clientes
        </a>

        <a href="produtos.html">
            <i class="fa-solid fa-shirt"></i>
            Produtos
        </a>

        <a href="vendas.html">
            <i class="fa-solid fa-cart-shopping"></i>
            Vendas
        </a>

        <a href="relatorios.html">
            <i class="fa-solid fa-file-lines"></i> Relatório
        </a>

        <a href="#" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
        </a>

    </div>

    <div class="main">

        <div class="card p-4">

            <h2 class="mb-4">
                Clientes
            </h2>

            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCliente">

                Novo Cliente

            </button>

            <table class="table table-striped">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="clientesTable"></tbody>

            </table>

        </div>

    </div>

    <div class="modal fade" id="modalCliente">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">
                    <h5>Novo Cliente</h5>
                </div>

                <div class="modal-body">

                    <input id="nome" class="form-control mb-2" placeholder="Nome">

                    <input id="cpf" class="form-control mb-2" placeholder="CPF">

                    <input id="email" class="form-control mb-2" placeholder="Email">

                    <input id="telefone" class="form-control mb-2" placeholder="Telefone">

                    <input id="endereco" class="form-control" placeholder="Endereço">

                </div>

                <div class="modal-footer">

                    <button class="btn btn-primary" onclick="salvarCliente()">

                        Salvar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="modal fade" id="modalEditar">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5>Editar Cliente</h5>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="editId">

                    <input id="editNome" class="form-control mb-2" placeholder="Nome">
                    <input id="editCpf" class="form-control mb-2" placeholder="CPF">
                    <input id="editEmail" class="form-control mb-2" placeholder="Email">
                    <input id="editTelefone" class="form-control mb-2" placeholder="Telefone">
                    <input id="editEndereco" class="form-control" placeholder="Endereço">

                </div>

                <div class="modal-footer">

                    <button class="btn btn-success" onclick="atualizarCliente()">
                        Salvar
                    </button>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/auth.js"></script>

    <script>
        verificarLogin();
    </script>

    <script src="js/clientes.js"></script>

</body>

</html>
