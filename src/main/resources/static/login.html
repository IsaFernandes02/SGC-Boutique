<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - SGC Boutique</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2>SGC Boutique</h2>

            <input type="text" id="username" class="form-control mb-3" placeholder="Usuário">

            <input type="password" id="senha" class="form-control mb-3" placeholder="Senha">

            <button class="btn btn-primary w-100" onclick="login()">
                Entrar
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        async function login() {

            const username =
                document.getElementById("username").value;

            const senha =
                document.getElementById("senha").value;

            const response = await fetch('/auth/login', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    username,
                    senha
                })

            });

            if (response.ok) {

                const token = await response.text();

                localStorage.setItem("token", token);

                window.location.href = "index.html";

            } else {

                alert("Usuário ou senha inválidos");

            }

        }

    </script>

</body>
</html>
